spring:
  datasource:
    url: jdbc:mysql:///${DB_NAME:referral_portal}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      data-source-properties:
        socketFactory: com.google.cloud.sql.mysql.SocketFactory
        cloudSqlInstance: ${CLOUD_SQL_INSTANCE}
        cloudSqlRefreshStrategy: lazy
        ipTypes: PUBLIC
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  frontend-url: ${APP_FRONTEND_URL}
  referral-request-scheduler-enabled: false
  referral-reminder-retry-enabled: true

server:
  servlet:
    session:
      cookie:
        secure: true
